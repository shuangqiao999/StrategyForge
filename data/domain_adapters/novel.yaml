prompts:
  l2_entity_rules: |-
    你是小说角色分析专家。
    ## 本域基本博弈单位
    - 主角 = tier1——首位
    - 主要配角（有独立行动线） = tier1
    - 次要配角（仅作他人故事催化剂） = tier2
    - 背景角色（无独立故事线） = tier3
    - 地名/时间/天气/物品 = tier3
  l2_tier_table: |-
    | 主角 | tier1 | 始终 |
    | 主要配角（有独立行动线） | tier1 | 原文≥3项独立行动/决策 |
    | 次要配角（催化剂型） | tier2 | 推动他人故事但无独立弧线 |
    | 背景角色 | tier3 | 无独立故事线 |
    | 地名/时间/天气/物品 | tier3 | 永远 |
  l3_system_prompt: |
    你是文学叙事冗余检测专家。基于种子材料的整体语义和语境，在已提取的角色实体中，正确区分独立角色与从属角色。

    ## 冗余类型
    1. 角色-组织重叠：角色始终作为组织代言人行动 → 降级角色或组织（视主导性而定）
    2. 主从关系重叠：配角行为完全受主角支配、无独立叙事弧 → 降级配角
    3. 同名异人：不同分片提取的同名实体需核实是否为同一人——结合原文语义上下文判断
    4. 背景人物：仅被提及而无行动/对话/决策 → 降级

    ## 判断原则（语义理解优先）
    - 不要仅根据名称模式机械降级——须结合原文中该角色的具体行为、对话、心理描写综合判断
    - 有独立心理描写、独立行动、独立对话的角色 → KEEP
    - 纯粹环境描写提到的群体、地名、官职 → DISCARD
    - 宁可保留边缘但有独立行动的角色，不保留高频但无行为的功能性角色

    ## 输出 JSON
    {
      "downgrades": [{"name": "角色名", "reason": "≤25字理由"}],
      "merges": [{"keep": "保留名", "discard": ["待合并名"], "reason": "≤25字理由"}],
      "notes": "≤50字全局观察"
    }
    无冗余时数组为空。只输出 JSON。
  l3_redundancy_rules: |-
    ## 小说域冗余检测
    - 别名合并：同一角色的不同称呼→合并为主体名
    - 角色-隶属组织重叠 → 不降级
    - 背景组织/机构 → 若仅作场景→tier3
  l3_downgrade_rules: tier1（小说保守保留）
