prompts:
  l2_entity_rules: |-
    你是地缘战略分析专家。
    ## 本域基本博弈单位
    - 主权国家 = 最高决策单位——不可再分
    - 独立军阀/叛军/割据政权 = 若有独立军事+外交决策→独立建组
    - 政府首脑/国家元首 = 国家意志的执行者，不独立于国家
    - 部长/将领/官员 = 被元首覆盖，不独立
    - 国际组织 = 若核心成员国已列席≥3→降级
    - 地缘区域/海峡/走廊 = 争夺舞台→tier2
    - 武器/条约/数据指标 = 非决策实体
  l2_tier_table: |-
    | 类型 | 层级 | 判定 | 易误判负例（看似tier1实为tier3） |
    |------|------|------|------------------------------|
    | 主权国家 | tier1 | 始终 | "台湾海峡"=地理，"亚太"=概念 |
    | 国家元首/政府首脑 | tier2 | 决策=国家决策 | 即使高频出场，权力源于国家→不独立建组 |
    | 官员/部长/将领 | tier3 | 决策空间被元首覆盖 | "国防部"=机构，"发言人"=执行角色 |
    | 独立军阀/叛军 | tier1 | ≥3项独立交战/征税/结盟证据 | 受中央派遣平叛的将领≠独立军阀 |
    | 国际组织/军事联盟 | tier2 | 核心成员国≥3已列席→tier3 | 即使有独立名称和秘书处 |
    | 地缘区域/海峡/走廊 | tier2 | 争夺舞台 | 仅作背景提及→tier3 |
    | 武器/条约/数据指标 | tier3 | 永远 | "F-35"=武器，"GDP"=数据，"中美贸易协定"=条约 |
  l3_system_prompt: |
    你是地缘战略冗余检测专家。严格按以下机械规则检测，规则优先于直觉。

    ## 必检清单（逐条执行）
    1. 人物-国家映射：人物在 person_country 表中且对应国家已在列表 → 降级人物
    2. 组织-成员映射：组织在 org_members 表中且 ≥3 核心成员国已在列表 → 降级组织
    3. 军队降级：名称以「军/军队/部队/武装/兵团」结尾 AND 对应国家已在列表 → 降级
       例外：原文中军队独立签署条约/独立宣战/独立控制领土 → 保留
    4. 政府机构：名称以「政府/部/委/局/署/厅」结尾 AND 对应国家已在列表 → 降级
    5. 同国多官员：同一国家 ≥2 名官员已在列表 → 全部降级
    6. 不满足以上任何一条 → 不冗余，保留
    7. 平行对等的独立政权 → 互不冗余，分别保留

    ## 输出 JSON
    {
      "downgrades": [{"name": "实体名", "reason": "≤25字理由"}],
      "merges": [{"keep": "保留名", "discard": ["待合并名"], "reason": "≤25字理由"}],
      "notes": "≤50字"
    }
    无冗余时数组为空。只输出 JSON。
  l3_redundancy_rules: |-
    ## 地缘域冗余检测
    - 元首-国家重叠 → 保留国家，降级元首
    - 政府机构-国家重叠 → 保留国家，降级机构
    - 军队-国家重叠 → 默认降级军队
    - 国际组织-成员国重叠 → 核心成员≥3已列席→降级组织
    - 同国多官员 → 均降级（决策被元首覆盖）
  l3_downgrade_rules: tier2
