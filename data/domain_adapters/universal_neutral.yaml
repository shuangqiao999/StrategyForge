tier_rule:
  force_tier1_base_types:
  - Agent
  force_tier2_base_types:
  - Subordinate
  force_tier3_base_types:
  - Resource
  - Geography
  - Contract
  - Event
  - Concept
  extra_rules: |-
    仅依据实体独立决策能力分级。拥有完整独立行动与利益诉求为tier1；依附其他主体决策为tier2；纯资源/工具/概念/地理/事件为tier3。

    ## 判定示例（学习用）
    - 「美国宣布对俄制裁」→ 美国执行独立决策 → tier1
    - 「Q3财报显示苹果营收增长」→ 财报/营收=数据指标 → tier3
    - 「共和党提出新法案」→ 政党依附美国政权 → tier2
    - 「北京发布空气重污染预警」→ 北京=城市/地点 → tier3（非决策者）
    - 「行业报告指出市场趋势」→ 报告/趋势=信息产物 → tier3

    ## 频次陷阱
    - 1次关键决策（制裁/宣战/投资/签署条约） > 10次背景提及
    - 高频出现但无主动行为 → tier3
