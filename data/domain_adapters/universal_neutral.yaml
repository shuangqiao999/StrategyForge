# StrategyForge DomainAdapter — 通用中立领域 (universal_neutral)
# 未知领域默认加载，无任何领域偏见，全领域通用中立规则

domain_meta:
  domain_id: universal_neutral
  display_name: 通用中立领域
  detect_keywords: []
  methodology_mode: neutral
param_config:
  shard_threshold: 12000
  shard_size: 7500
  shard_overlap: 800
  jaccard_threshold: 0.45
  max_sample_chars: 8000
  sampling:
    head_size: 2000
    tail_size: 2000
    lit_mode: false
  token:
    l1_normalize:
      base: 200
      per: 150
      cap: 12000
    l1_shard:
      base: 200
      per: 200
      cap: 6000
    l1_refine:
      base: 200
      per: 120
      cap: 8000
    l2_classify:
      base: 150
      per: 100
      cap: 4000
    l3_cross:
      base: 300
      per: 60
      cap: 3000
  cache:
    l1_enabled: true
    l1_max_entries: 16
    l3_enabled: true
    l3_max_entries: 64
    ttl_sec: 1800
