tier_rule:
  force_tier1_base_types:
  - Agent
  force_tier2_base_types:
  - Subordinate
  force_tier3_base_types:
  - Resource
  - Geography
  - Contract
  - Event
  - Concept
  extra_rules: |-
    仅依据实体独立决策能力分级。拥有完整独立行动与利益诉求为tier1；依附其他主体决策为tier2；纯资源/工具/概念/地理/事件为tier3。

    ## 活性检验参考
    - 实体执行独立行为（宣布/决定/发起/签署/制裁/拒绝/要求/投资）→ 独立决策
    - 实体仅被报道/引用/分析 → 被动背景，tier3
    - 政党/政治派别 → tier2，依附更高层级政权
    - 频次陷阱：1次关键决策 > 10次背景提及
layer_config:
  skip_layer3: false
  min_kept_for_check: 3
  warn_threshold: 8
  desc_truncate: 80
  sample_chars_l3: 5000
  monarchs_force_tier1: false
  warlord_force_tier1: false
  strategic_geo_tier2: false
  log_file: ''
  fallback_rules:
    org_overlap_threshold: 3
    org_members_map: {}
    person_country_map: {}
prompts:
  l2_entity_rules: |-
    你是通用博弈分析专家。
    ## 本域基本博弈单位
    - 有独立行为+独立决策权的实体 = tier1——不论类型（企业/国家/组织/独立政权/军阀/有独立叙事弧的角色）
    - 该实体的领导/负责人 = tier2（决策⊆上级决策）
    - 该实体的下属/部门/子品牌/成员 = tier3（决策被覆盖）
    - 政党/政治派别/意识形态运动 = tier2（国内政治子系统，依附更高级政权）
    - 工具/资源/概念/数据/地点/报告/指标 = tier3

    ## 活性检验（独立决策 vs 被动背景）
    - 实体执行了独立行为（宣布/决定/发起/签署/制裁/拒绝/要求/投资/出兵）→ 独立决策
    - 实体仅被报道/提及/引用/分析，无主动行为 → 被动背景，tier3
    - 实体名称含"报告/数据/指标/趋势/调查" → 信息产物，tier3
    - 频次陷阱：高频≠重要，1次关键决策 > 10次背景提及
  l2_tier_table: |-
    | 独立决策实体（不论类型） | tier1 | 始终——该域最高博弈单位 |
    | 该实体的领导/负责人 | tier2 | 决策⊆上级决策 |
    | 政党/政治派别 | tier2 | 国内政治子系统 |
    | 该实体的下属/部门/子品牌 | tier3 | 决策空间被覆盖 |
    | 工具/资源/概念/数据/地点/报告 | tier3 | 永远
  l3_system_prompt: |-
    你是通用博弈实体冗余检测专家。检测实体间是否存在决策权重叠。
    ## 核心原则
    - 一个实体决策空间 ⊆ 另一实体时 → 前者冗余
    - 仅当重叠 ≥ 60% 且一方完全覆盖另一方时才判定冗余
    - 不确定 → 保留不降级
  l3_redundancy_rules: |-
    ## 通用冗余检测（中立，无领域偏见）
    - 领导-实体重叠 → 保留实体，降级领导
    - 组织-成员重叠 → 核心成员≥3已独立列席时降级组织；否则保留
    - 子品牌/产品线/下级机构-主体重叠 → 合并到主体
    - 政党/政治派别-政权重叠 → 降级政党（国内子系统）
    - 政策口号/主义-国家重叠 → 降级口号（非独立博弈者）
    - 平行对等主体 → 互不冗余，分别保留
    - 不确定者 → 保守保留，不降级
  l3_downgrade_rules: tier2
aliases:
  _org_members: {}
  _person_country: {}
  _force_keep: []
  entity_aliases: {}
  _strategic_regions: []
