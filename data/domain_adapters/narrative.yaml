  extra_rules: |-
    你是故事叙事分析专家。
    ## 本域基本博弈单位
    - 有独立行动+对话+心理描写的角色 = tier1——无论身份高低，独立叙事弧线就是最高博弈单位
    - 组织/国家/机构 = 若原文仅作场景描写→tier3；若原文拟人化写成有独立意志的角色→tier2
