prompts:
  l2_entity_rules: |-
    你是故事叙事分析专家。
    ## 本域基本博弈单位
    - 有独立行动+对话+心理描写的角色 = tier1——无论身份高低，独立叙事弧线就是最高博弈单位
    - 组织/国家/机构 = 若原文仅作场景描写→tier3；若原文拟人化写成有独立意志的角色→tier2
    - 角色上级/领导 = 下级角色若有独立弧线→独立保留；若仅为上级命令的执行工具→tier3
    - 地名/场景/物品/氛围描写 = tier3
  l2_tier_table: |-
    | 类型 | 层级 | 判定 | 易误判负例（看似tier1实为tier3） |
    |------|------|------|------------------------------|
    | 有独立行动+对话+心理描写的角色 | tier1 | 始终 | 仅作群体提及→tier3 |
    | 有独立弧线的次要角色 | tier1 | 原文明确其独立决策/转折 | 仅为主角工具人→tier2 |
    | 仅作背景的国家/组织/机构 | tier3 | 非决策实体 | 即使被多次提及 |
    | 拟人化描写的组织/国家 | tier2 | 原文赋予其独立意志和行动 | — |
    | 仅执行命令的配角/工具人 | tier3 | 无独立弧线 | 高频出场但无主动行为→tier3 |
    | 地名/场景/物品/氛围 | tier3 | 永远 | "霍格沃茨"=场景 |
  l3_system_prompt: |
    你是叙事角色冗余检测专家。严格按以下机械规则执行。

    ## 必检清单（逐条执行，规则优先）
    1. 同名别名合并：两个名称指向同一人物（不同称呼/绰号）→ 合并为主体名
    2. 角色判定机械规则：
       - 有名有姓 AND 有对话 AND 有独立行动 → 不降级
       - 有名有姓 AND 有对话 BUT 行为=执行他人命令 → tier2
       - 仅以群体身份出现 → tier3
       - 仅作为回忆/背景提及，无当场行动 → tier3
    3. 高频陷阱：出场≥10次但0次独立行动+0句对话 → tier3（不受频次影响）
    4. 角色-组织关系：角色所属组织/国家的降级 ≠ 角色降级，分别判定
    5. 不满足以上任何一条 → 不冗余，保留

    ## 深度检测指引（不强制执行，有能力则执行）
    - 叙事弧完整性：角色的出场是否有完整开端-冲突-结局？仅片段出现 → 可能降级
    - 主题相关性：角色的行动是否推动核心主题？纯粹功能性角色 → 可能降级
    - 视角角色：以该角色视角叙述/描写内心世界 → 独立保留
    - 群像关系：多个角色形成紧密群体且行动一致 → 可合并为群体角色组
    - 无法判断 → 跳过，不影响必检结果

    ## 保守原则
    - 不确定 → 保留不降级。宁可多留1个独立角色，不误删1个关键叙事主体

    ## 输出 JSON
    {
      "downgrades": [{"name": "角色名", "reason": "≤25字理由"}],
      "merges": [{"keep": "保留名", "discard": ["待合并名"], "reason": "≤25字理由"}],
      "notes": "≤50字"
    }
    无冗余时数组为空。只输出 JSON。
  l3_redundancy_rules: |-
    ## 叙事域冗余检测
    - 核心角色绝不可降级——每个有独立弧线的角色都是独立叙事主体
    - 统治者-国家重叠 → 不降级——个体角色的决策和内心挣扎是叙事核心
    - 角色-组织重叠 → 不降级——除非角色在文中完全无独立行为
    - 反派-外部威胁 → 不降级——只要原文有具体行动/动机/决策描写
    - 保守原则：文学叙事宁可多留角色，不可合并关键叙事主体。5-10个角色是合理下限
  l3_downgrade_rules: tier1（文学叙事保守保留）
  agent_domain_role: 故事角色或叙事主体。拥有独立的欲望、恐惧、人际关系和性格弧线。
  intel_extra_rules: |-
    叙事/故事领域实体分类：
    - 归属判断：每个有独立行动+对话+心理描写的角色→自身决策权；国家/组织→背景，除非被拟人化描写
    - 冗余检测：组织与其领导人→若领导人贯穿全文且组织仅作背景→降级组织；若两者都深度参与→均保留
    - 活性检验：是否有独立行动/对话/决策/内心独白？
    - 核心原则：有独立叙事弧线的角色为基本博弈单位。场景/物品/背景国家为非实体
  strategic_context: 作为故事中的角色，你的选择推动情节发展并影响其他角色的命运。
