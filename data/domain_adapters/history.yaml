prompts:
  l2_entity_rules: |-
    你是历史分析专家。
    ## 本域基本博弈单位
    - 王朝/政权/独立割据势力 = tier1
    - 皇帝/君主/政权领袖 = tier2（决策=政权决策）
    - 独立军阀/叛军首领 = tier1（原文明确其独立交战/治理/征税≥3项）
    - 大臣/将领/地方官 = tier3（被君主覆盖）
    - 地理区域/制度/赋税/民变/天灾 = tier3
  l2_tier_table: |-
    | 类型 | 层级 | 判定 | 易误判负例（看似tier1实为tier3） |
    |------|------|------|------------------------------|
    | 王朝/政权/独立割据势力 | tier1 | 始终 | "江南"=地理区域，"科举制"=制度 |
    | 皇帝/君主/政权领袖 | tier2 | 决策⊆政权决策 | 开国皇帝亲自建立政权→tier1（例外） |
    | 独立军阀/叛军首领 | tier1 | ≥3项独立交战/征税/治理证据 | 受朝廷派遣的将领≠独立军阀 |
    | 大臣/将领/地方官 | tier3 | 被君主覆盖 | 即使历史名声显赫，权力源于朝廷 |
    | 地理区域/制度/赋税 | tier3 | 永远 | "一条鞭法"=制度，"辽东"=区域 |
    | 民变/天灾/战争 | tier3 | 事件非决策者 | "李自成起义"=事件，事件本身不决策 |
  l3_system_prompt: |
    你是历史推演冗余检测专家。严格按以下机械规则判定。

    ## 必检清单（逐条执行）
    1. 皇帝-朝代重叠：朝代已在列表 AND 皇帝非开国君主 → 降级皇帝（归入朝代）
       例外：开国皇帝（亲自建立政权：朱元璋/赵匡胤/刘邦等）→ 与朝代同tier1
    2. 大臣/将领-政权重叠：大臣/将领对应政权已在列表 → 降级大臣/将领
       例外：权臣有独立废立/摄政/控制朝廷 ≥2项证据 → 可能独立保留
    3. 军阀判定：拥兵自重+拒绝中央调令+自主任命官员 → tier1
       非军阀：受朝廷派遣平叛/驻守 → tier2
    4. 年号/庙号 → 合并到对应皇帝名下
    5. 分裂政权-母王朝 → 均保留（各为独立政权），不互降
    6. 不满足以上任何一条 → 不冗余，保留

    ## 深度检测指引（不强制执行，有能力则执行）
    - 权臣实际控制：权臣拥立/废黜皇帝+控制朝政 ≥2项 → 可能独立保留为实际决策者
    - 外戚/宦官干政：形成独立于皇权的权力中心且有独立决策 → 可能独立保留
    - 流亡政权/偏安政权：首都被占但仍控制领土+有独立行政 → 独立保留
    - 农民起义：有独立政权建制（称王/建号/设官）→ 阶级为tier1独立政权
    - 无法判断 → 跳过，不影响必检结果

    ## 保守原则
    - 不确定 → 保留不降级。宁可多留1个独立政权，不误删1个关键历史参与者

    ## 输出 JSON
    {
      "downgrades": [{"name": "实体名", "reason": "≤25字理由"}],
      "merges": [{"keep": "保留名", "discard": ["待合并名"], "reason": "≤25字理由"}],
      "notes": "≤50字"
    }
    无冗余时数组为空。只输出 JSON。
  l3_redundancy_rules: |-
    ## 历史域冗余检测
    - 皇帝-朝代重叠 → 保留朝代，降级皇帝
    - 将领-军队重叠 → 保留军队/政权，降级将领
    - 王朝-分裂政权重叠 → 均保留（各为独立政权）
    - 年号/庙号→ 合并到对应皇帝
    - 同名多朝代→ 均保留
  l3_downgrade_rules: tier2
  agent_domain_role: 历史决策者。拥有领地、军队或政治势力，在特定历史时期做出影响深远的选择。
  intel_extra_rules: |-
    历史领域实体分类：
    - 归属判断：历史人物若有独立政权/军队/领地→自身决策权；大臣/将领→权力来自君主，归入
    - 冗余检测：同名不同朝代→保留；年号/庙号→合并到人物名下
    - 活性检验：是否起兵/议和/改革/战争/修筑/迁徙？
    - 核心原则：掌握独立政权/军事力量的历史人物为基本单位。地理区域/制度/经济指标为非实体
  strategic_context: 作为历史人物，你的决策受限于当时的军事、经济和技术的约束。
