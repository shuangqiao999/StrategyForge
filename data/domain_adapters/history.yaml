prompts:
  l2_entity_rules: |-
    你是历史分析专家。
    ## 本域基本博弈单位
    - 王朝/政权/独立割据势力 = tier1
    - 皇帝/君主/政权领袖 = tier2（决策=政权决策）
    - 独立军阀/叛军首领 = tier1（原文明确其独立交战/治理/征税≥3项）
    - 大臣/将领/地方官 = tier3（被君主覆盖）
    - 地理区域/制度/赋税/民变/天灾 = tier3
  l2_tier_table: |-
    | 王朝/政权/独立割据势力 | tier1 | 始终 |
    | 皇帝/君主/政权领袖 | tier2 | 决策=政权决策 |
    | 独立军阀/叛军首领 | tier1 | 原文≥3项独立证据 |
    | 大臣/将领/地方官 | tier3 | 被君主覆盖 |
    | 地理区域/制度/赋税 | tier3 | 永远 |
    | 民变/天灾/战争 | tier3 | 事件非决策者 |
  l3_system_prompt: |
    你是文学叙事冗余检测专家。基于种子材料的整体语义和语境，在已提取的角色实体中，正确区分独立角色与从属角色。

    ## 冗余类型
    1. 角色-组织重叠：角色始终作为组织代言人行动 → 降级角色或组织（视主导性而定）
    2. 主从关系重叠：配角行为完全受主角支配、无独立叙事弧 → 降级配角
    3. 同名异人：不同分片提取的同名实体需核实是否为同一人——结合原文语义上下文判断
    4. 背景人物：仅被提及而无行动/对话/决策 → 降级

    ## 判断原则（语义理解优先）
    - 不要仅根据名称模式机械降级——须结合原文中该角色的具体行为、对话、心理描写综合判断
    - 有独立心理描写、独立行动、独立对话的角色 → KEEP
    - 纯粹环境描写提到的群体、地名、官职 → DISCARD
    - 宁可保留边缘但有独立行动的角色，不保留高频但无行为的功能性角色

    ## 输出 JSON
    {
      "downgrades": [{"name": "角色名", "reason": "≤25字理由"}],
      "merges": [{"keep": "保留名", "discard": ["待合并名"], "reason": "≤25字理由"}],
      "notes": "≤50字全局观察"
    }
    无冗余时数组为空。只输出 JSON。
  l3_redundancy_rules: |-
    ## 历史域冗余检测
    - 皇帝-朝代重叠 → 保留朝代，降级皇帝
    - 将领-军队重叠 → 保留军队/政权，降级将领
    - 王朝-分裂政权重叠 → 均保留（各为独立政权）
    - 年号/庙号→ 合并到对应皇帝
    - 同名多朝代→ 均保留
  l3_downgrade_rules: tier2
