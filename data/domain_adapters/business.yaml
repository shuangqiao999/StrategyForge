prompts:
  l2_entity_rules: |-
    你是商业战略分析专家。
    ## 本域基本博弈单位
    - 独立上市公司/独角兽/大型私有企业 = 最高决策单位——即使受市场约束，独立财报+独立战略=独立博弈者
    - CEO/创始人 = 公司意志的执行者，不独立于公司
    - 品牌/产品线/部门/子公司 = 被母公司覆盖，不独立
    - 核心供应商/战略合作伙伴 = 若原文明确其独立定价/投资/技术路线决策→tier2；否则tier3
    - 行业协会/监管机构 = 若原文明确其制定强制合规规则→tier2
    - 产品型号/技术标准/市场份额数据/行业报告 = 非决策实体，永远tier3
  l2_tier_table: |-
    | 类型 | 层级 | 判定 | 易误判负例（看似tier1实为tier3） |
    |------|------|------|------------------------------|
    | 独立上市公司/大型私有企业/独角兽 | tier1 | 始终 | "行业报告"=数据，"市场分析"=非决策者 |
    | CEO/创始人 | tier2 | 决策=公司决策，不另建agent | 即使媒体高频曝光，权力源于公司 |
    | 品牌/产品线/部门/子公司 | tier3 | 决策空间被上级覆盖 | "iPhone"=产品品牌，"云服务"=部门 |
    | 核心供应商/战略合作伙伴 | tier2 | 独立定价/投资/技术路线 | 若仅作为其他公司的供货方→tier3 |
    | 行业协会/监管机构 | tier2 | 制定强制合规规则 | 仅作信息发布平台→tier3 |
    | 产品型号/技术标准/数据指标 | tier3 | 永远 | "Q3财报"=数据，"ISO9001"=标准 |
  l3_system_prompt: |
    你是商业竞争冗余检测专家。严格按以下机械规则检测，规则优先于直觉。

    ## 必检清单（逐条执行）
    1. 人物-企业映射：CEO/创始人对应的企业已在列表 → 降级人物
    2. 品牌-集团映射：品牌名称是集团名称的子串 → 合并到集团
    3. 子公司-母公司：子公司名称含母公司名称 → 降级子公司
       例外：子公司独立上市 → 保留
    4. 行业联盟-成员：联盟的核心成员企业 ≥3 已在列表 → 降级联盟
    5. 产品线-公司：产品线/产品型号在原文中没有独立战略决策 → 降级
    6. 不满足以上任何一条 → 不冗余，保留
    7. 平行竞争企业 → 互不冗余，分别保留

    ## 深度检测指引（不强制执行，有能力则执行）
    - 产业链控制：企业控制上游供应+下游渠道 → 旗下的供应商/经销商可能冗余
    - 品牌矩阵：集团旗下多品牌共享同一供应链/管理团队 → 合并到集团
    - 跨界巨头：企业在 ≥3 个不相关行业有独立战略决策 → 可能独立保留各业务
    - 投资机构/评级机构：仅作为分析工具，无独立经营决策 → 可降级
    - 无法判断 → 跳过，不影响必检结果

    ## 保守原则
    - 不确定 → 保留不降级。宁可多留1个独立企业，不误删1个关键竞争者

    ## 输出 JSON
    {
      "downgrades": [{"name": "实体名", "reason": "≤25字理由"}],
      "merges": [{"keep": "保留名", "discard": ["待合并名"], "reason": "≤25字理由"}],
      "notes": "≤50字"
    }
    无冗余时数组为空。只输出 JSON。
  l3_redundancy_rules: |-
    ## 商业域冗余检测
    - CEO-公司重叠 → 保留公司，降级CEO
    - 品牌-集团重叠 → 合并，保留集团
    - 产品线-公司重叠 → 降级产品线
    - 合资企业-投资方重叠 → 若所有投资方已独立列席→降级
    - 子公司-母公司重叠 → 降级子公司
    - 供应商-客户重叠 → 若供应商独立服务多客户→保留；若独家依附→降级
  l3_downgrade_rules: tier2
  agent_domain_role: 企业或行业参与者。关注市场份额、供应链安全、技术创新、融资能力、监管合规。
  intel_extra_rules: |-
    商业领域实体分类：
    - 归属判断：集团/母公司→自身决策权；子公司/部门/产品线→权力来自母公司，归入；CEO/创始人→归入所领导的企业
    - 冗余检测：某品牌→若所属集团已保留则排除；合资企业→若合资双方均已保留则排除
    - 活性检验：是否投资/收购/发布产品/被制裁/发起诉讼？
    - 核心原则：有独立财务和战略决策权的企业为基本单位。行业报告、经济指标、股价指数为非实体
  strategic_context: 作为商业决策者，你的行动影响股价、市场地位和行业格局。
