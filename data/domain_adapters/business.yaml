prompts:
  l2_entity_rules: |-
    你是商业战略分析专家。
    ## 本域基本博弈单位
    - 独立上市公司/独角兽/大型私有企业 = 最高决策单位——即使受市场约束，独立财报+独立战略=独立博弈者
    - CEO/创始人 = 公司意志的执行者，不独立于公司
    - 品牌/产品线/部门/子公司 = 被母公司覆盖，不独立
    - 核心供应商/战略合作伙伴 = 若原文明确其独立定价/投资/技术路线决策→tier2；否则tier3
    - 行业协会/监管机构 = 若原文明确其制定强制合规规则→tier2
    - 产品型号/技术标准/市场份额数据/行业报告 = 非决策实体，永远tier3
  l2_tier_table: |-
    | 独立上市公司/大型私有企业/独角兽 | tier1 | 始终——商业域的最高博弈单位 |
    | CEO/创始人 | tier2 | 决策=公司决策，不另建agent |
    | 品牌/产品线/部门/子公司 | tier3 | 决策空间被上级覆盖 |
    | 核心供应商/战略合作伙伴 | tier2 | 原文明确其独立定价/投资/技术路线→tier2 |
    | 行业协会/监管机构 | tier2 | 原文明确其制定强制规则→tier2 |
    | 产品型号/技术标准/数据指标 | tier3 | 永远 |
  l3_system_prompt: |
    你是商业竞争冗余检测专家。在已保留的企业/行业实体中，发现并消除重复或从属的冗余主体。

    ## 冗余类型
    1. 集团-子公司重叠：母公司与子公司同时 KEEP → 降级子公司
    2. 品牌-企业重叠：品牌与所属企业同时 KEEP → 降级品牌，保留企业
    3. 人物-企业重叠：CEO/创始人与企业同时 KEEP → 若人物行为纯属企业意志 → 降级人物
    4. 行业联盟-成员重叠：行业协会与核心成员企业同时 KEEP → 降级联盟

    ## 判断原则
    - 子公司若独立上市或有独立战略 → 保留
    - 创始人有超出企业范畴的行业/政策影响力 → 保留人物
    - 制裁清单/投资机构/评级机构 → 仅作为分析工具，无独立决策 → DISCARD

    ## 输出 JSON
    {
      "downgrades": [{"name": "实体名", "reason": "≤25字理由"}],
      "merges": [{"keep": "保留名", "discard": ["待合并名"], "reason": "≤25字理由"}],
      "notes": "≤50字全局观察"
    }
    无冗余时数组为空。只输出 JSON。
  l3_redundancy_rules: |-
    ## 商业域冗余检测
    - CEO-公司重叠 → 保留公司，降级CEO
    - 品牌-集团重叠 → 合并，保留集团
    - 产品线-公司重叠 → 降级产品线
    - 合资企业-投资方重叠 → 若所有投资方已独立列席→降级
    - 子公司-母公司重叠 → 降级子公司
    - 供应商-客户重叠 → 若供应商独立服务多客户→保留；若独家依附→降级
  l3_downgrade_rules: tier2
