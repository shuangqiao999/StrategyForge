tier_rule:
  force_tier1_base_types:
  - Agent
  force_tier2_base_types:
  - Subordinate
  force_tier3_base_types:
  - Resource
  - Geography
  - Contract
  - Event
  - Concept
  extra_rules: |-
    你是商业博弈分析专家。
    ## 本域博弈主体判定
    - 有独立战略决策+独立行动+独立利益诉求的企业/组织 = tier1
    - 仅作为背景提及、仅以数据/报告中出现的企业 → 可能是被动背景，审视其出场频次和上下文
    - 企业CEO/创始人 → 决策⊆企业决策，tier2
    - 品牌/产品线/部门/子公司 → 决策被上级覆盖，tier3
    - 政策/标准/白皮书/报告/数据 → tier3（非决策者）
    - 高频≠重要：1次关键战略决策 > 10次行业报告中的背景提及

    ## 频次保护
    - 出场仅1-2次且无独立决策行为的企业 → tier2（保留但不生成独立智能体）
    - 出场≥3次且有独立战略行动的企业 → tier1
