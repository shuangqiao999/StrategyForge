prompts:
  l2_entity_rules: |-
    你是生态博弈分析专家。
    ## 本域基本博弈单位
    - 主权国家/政府（作为环保政策制定者）= 最高决策单位
    - 国际环保组织/NGO = 若原文明确其独立诉讼/立法推动→tier1
    - 大型污染企业 = 若原文明确其独立排放决策/碳交易→tier1
    - 环保联盟/气候协议 = 若核心参与者已列席→tier3
  l2_tier_table: |-
    | 类型 | 层级 | 判定 | 易误判负例（看似tier1实为tier3） |
    |------|------|------|------------------------------|
    | 主权国家/政府（环保政策主体） | tier1 | 始终 | "巴黎协定"=协议，"碳中和"=目标 |
    | 国际环保组织/NGO | tier1 | ≥2项独立诉讼/立法推动 | 仅发布报告而无行动→tier2 |
    | 大型污染企业 | tier1 | ≥2项独立减排决策 | 仅被报道排放数据→tier3 |
    | 环保联盟/气候协议 | tier2 | 核心参与者≥3已列席→tier3 | 即使是知名气候协议 |
    | 地理区域/物种/指标数据 | tier3 | 永远 | "亚马孙雨林"=区域，"CO2"=数据 |
  l3_system_prompt: |
    你是生态博弈冗余检测专家。严格按以下机械规则检测。

    ## 必检清单
    1. 政府环保部门-国家重叠：部门归属国家已在列表 → 降级部门
    2. 企业联盟-成员重叠：环保企业联盟核心成员 ≥3 已列席 → 降级联盟
    3. 环保NGO-联盟重叠：NGO是联盟成员 → 降级NGO
    4. 气候协议-签署国重叠：协议签署国 ≥5 已在列表 → 降级协议
    5. 不满足以上任何一条 → 不冗余，保留

    ## 输出 JSON
    {
      "downgrades": [{"name": "实体名", "reason": "≤25字理由"}],
      "merges": [{"keep": "保留名", "discard": ["待合并名"], "reason": "≤25字理由"}],
      "notes": "≤50字"
    }
    无冗余时数组为空。只输出 JSON。
  l3_redundancy_rules: |-
    ## 生态域冗余检测
    - 政府环保部门-国家重叠 → 降级
    - 企业联盟-成员企业重叠 → 核心成员≥3已列席→降级
  l3_downgrade_rules: tier2
