# StrategyForge 通用方法论 — 量化/叙事双模式共用
# 注入 LLM Prompt，零领域偏见，全领域通用

_role_inference: |
  ## 角色推断指引（根据实体信息自行判定角色标签）
  1. 名称直接反映业务 → 据此推断行业（"XX咖啡"→消费品牌，"XX汽车"→汽车制造商）
  2. 描述中有关键业务词 → 据此精确行业（"换电"→新能源，"智驾"→出行科技）
  3. 类型为企业/Company 但无行业线索 → 写"行业参与者"
  4. 类型为国家/Country → 写"主权国家"
  5. 类型为政党/Party → 写"政治力量"
  6. 类型为国际组织 → 写"国际组织"
  7. 类型为 NGO/非政府组织 → 写"民间组织"
  8. 类型为军阀/叛军/武装组织 → 写"武装力量"
  9. 类型为人物/Person 且有独立行动 → 写其核心身份（领袖/创始人/指挥官/活动家）
  10. 角色标签≤8字，使用中文行业通用称谓

_sentiment_inference: |
  ## 行动情绪判定指引
  判断跨实体行动的友好/敌对/中性性质：
  - 对抗/压制/攻击/封锁/制裁/背叛/围堵/打压 → 敌对
  - 合作/投资/援助/结盟/签约/开放/支持/妥协 → 友好
  - 观察/分析/内部调整/信息发布 → 中性
  - 同一行动对不同目标可能情绪不同：对盟友投资=友好，对敌人投资=渗透

_trust_action_mapping: |
  ## 信任影响推断指引
  每次跨实体行动应估计对双方信任度的影响（-5到+5）：
  【敌对行动】
  - 军事攻击/宣战 → -5
  - 制裁/封锁/断交 → -4
  - 背叛同盟/撕毁协议 → -4
  - 技术封锁/出口管制 → -3
  - 价格战/恶意收购 → -2
  【友好行动】
  - 军事同盟/共同防御 → +5
  - 战略投资/技术转让 → +4
  - 贸易协定/市场开放 → +3
  - 外交访问/联合声明 → +2
  - 情报共享/技术交流 → +1
  【中性行动】
  - 信息获取/观察/财报发布 → 0
  - 内部调整/人事变动 → 0

_entity_role_examples: |
  ## 各行业角色标签参考
  消费品牌：瑞幸咖啡、库迪、蜜雪冰城、星巴克、海底捞
  汽车制造商：比亚迪、蔚来、理想汽车、小鹏、特斯拉
  科技企业：华为、寒武纪、平头哥、英伟达、DeepSeek
  内容平台/媒体：抖音、快手、小红书、B站、财新
  金融机构：红杉资本、高瓴、软银、黑石、桥水
  主权国家：中国、美国、俄罗斯、法国、日本
  国际组织：联合国、欧盟、北约、WTO、IMF
  武装力量：美军、俄军、胡塞武装、塔利班、哈马斯
  政治力量：共和党、民主党、自民党、保守党

_domain_action_principles: |
  ## 各领域行动原则（参考）
  【地缘/军事】
  - 主权国家不可再分，军队默认归属国家
  - 独立军阀需≥3项独立交战/征税/结盟证据
  - 国际组织核心成员≥3已列席→降级组织
  
  【商业/经济】
  - 独立上市/独角兽/大型私有企业为最高博弈单位
  - CEO/创始人决策⊆公司决策
  - 品牌/产品线/子公司决策被上级覆盖
  
  【政治】
  - 独立政党/有选民授权的政治运动为最高博弈单位
  - 党魁/总统决策⊆政党决策
  - 意识形态/政策口号/民调数据为非决策实体
  
  【叙事/文学】
  - 有独立行动+对话+心理描写的角色为最高博弈单位
  - 核心角色绝不可降级
  - 仅作为背景提及→tier3

