  business:
    heavy: [监管打击, 并购事件, 数据安全, 融资事件, 供应链中断]
    medium: [市场份额变化, 人才流失, 财报未达标, 遭制裁, 声誉危机]
    light: [竞品突破]
  politics:
    heavy: [选举事件, 民意逆转, 党内斗争]
    medium: [立法受阻]
    light: [意外转折]
  tech:
    heavy: [技术封锁, 产品事件, 数据安全]
    medium: [人才争夺, 遭制裁]
    light: [技术突破]
  ecology:
    heavy: [环境灾难, 气候事件]
